services:
  init-data:
    image: python:3.12-slim
    volumes:
      - .:/opt/research:ro
      - ./.data:/seed:ro
      - news-data:/data
    environment:
      DATA_UID: "${AIRFLOW_UID:-50000}"
    command: ["python", "/opt/research/scripts/init_data.py"]
  dashboard:
    depends_on:
      init-data:
        condition: service_completed_successfully
    image: python:3.12-slim
    user: "${AIRFLOW_UID:-50000}:0"
    working_dir: /opt/research
    volumes:
      - .:/opt/research:ro
      - news-data:/opt/research/.data
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    command: ["python", "-u", "server.py", "--analysis", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
  news-worker:
    depends_on:
      init-data:
        condition: service_completed_successfully
    image: python:3.12-slim
    user: "${AIRFLOW_UID:-50000}:0"
    working_dir: /opt/research
    volumes:
      - .:/opt/research:ro
      - news-data:/opt/research/.data
    command: ["python", "-u", "news_ingestion.py", "worker", "--interval", "10"]
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import time;from news_ingestion import status;s=status();from datetime import datetime;assert s.get('last_success') and time.time()-datetime.fromisoformat(s['last_success']).timestamp()<120"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
  airflow:
    depends_on:
      init-data:
        condition: service_completed_successfully
    image: apache/airflow:3.4.0-python3.12
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - .:/opt/research:ro
      - news-data:/opt/research/.data
    environment:
      AIRFLOW_HOME: /opt/research/.data/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/research/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      PYTHONPATH: /opt/research
    command: standalone
    ports:
      - "127.0.0.1:8089:8080"
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  news-data:
